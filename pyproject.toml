[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cammy"
dynamic = ["version"]
description = "Make your webcam look good in real time, with a virtual camera for video calls"
readme = "README.md"
requires-python = ">=3.12"
# Lower bounds are the versions this was tested with (see "Tested with" in the README); older ones are untested.
dependencies = [
    "numpy>=2.0",
    "opencv-contrib-python>=5.0",   # the contrib build, because mediapipe requires it (do not also install opencv-python)
    "mediapipe>=1.1",
    "pyvirtualcam>=0.15",
    "PySide6-Essentials>=6.11",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
]

[project.optional-dependencies]
# There is deliberately no "ai" extra: ncnn declares opencv-python as a dependency, which installs a
# second, clashing OpenCV. The AI look is added with `pip install --no-deps ncnn` (see the README).
dev = ["pytest"]

[project.scripts]
cammy = "cammy.main:main"
cammy-gui = "cammy.gui:main"
cammy-setup-camera = "cammy.setup_camera:main"
cammy-install-desktop = "cammy.desktop:main"
cammy-doctor = "cammy.doctor:main"

[tool.setuptools.dynamic]
version = {attr = "cammy.__version__"}

[tool.setuptools.packages.find]
include = ["cammy*"]

[tool.setuptools.package-data]
cammy = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
